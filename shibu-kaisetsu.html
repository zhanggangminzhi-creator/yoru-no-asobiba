<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>支部編成と名称の見直しについて｜解説動画</title>
<style>
  :root{
    /* このテンプレートは口パクを行わない設計（静止画では不自然になりやすいため）。
       発話中は #character-wrap.talking の発光演出のみで示す。 */
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#111; font-family:"Hiragino Sans","Noto Sans JP",sans-serif; }

  #wrap{
    width:100%; max-width:1280px; aspect-ratio:16/9; margin:0 auto;
    position:relative; background:#000; overflow:hidden;
  }

  #slide-layer{ position:absolute; inset:0; }
  #slide-layer img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    background:#fff; opacity:0; transition:opacity .4s ease;
  }
  #slide-layer img.active{ opacity:1; }

  /* ===== キャラクター表示エリア（右下） ===== */
  #character-wrap{
    position:absolute; right:2%; bottom:0; height:48%;
    transition: filter 150ms ease-in-out;
  }
  #character-wrap img.char-full{
    display:block; height:100%; width:auto;
    filter: drop-shadow(0 0 0 rgba(90,160,255,0));
    transition: filter 150ms ease-in-out;
  }
  /* 話している間だけ、輪郭にごく控えめな光を入れて「発話中」を示す。
     口の動き自体は静止画1枚では不自然になりやすいため、あえて動かさない。 */
  #character-wrap.talking img.char-full{
    filter: drop-shadow(0 0 10px rgba(120,180,255,.55)) drop-shadow(0 0 22px rgba(120,180,255,.25));
  }

  #subtitle{
    position:absolute; left:3%; right:26%; bottom:2.5%;
    text-align:center; pointer-events:none;
  }
  #subtitle span{
    background:rgba(0,0,0,.62); color:#fff; font-size:clamp(11px,1.6vw,17px);
    line-height:1.45; padding:.3em .8em; border-radius:6px; display:inline-block;
  }

  #controls{
    max-width:1280px; margin:12px auto; text-align:center;
  }
  #controls button{
    font-size:16px; padding:.6em 1.4em; border-radius:999px; border:none;
    background:#3a7afe; color:#fff; cursor:pointer;
  }
  #controls button:disabled{ opacity:.5; cursor:default; }
  #voice-controls{
    max-width:1280px; margin:8px auto 0; text-align:center;
    font-size:13px; color:#ccc;
  }
  #voice-controls label{ display:inline-block; margin:0 10px; }
  #voice-controls input[type="range"]{ vertical-align:middle; }
</style>
</head>
<body>

<div id="wrap">
  <div id="slide-layer"><!-- JSでスライド<img>をここに生成 --></div>

  <div id="character-wrap">
    <img class="char-full" id="char-full-img" src="" alt="character">
  </div>

  <div id="subtitle"><span id="subtitle-text"></span></div>
</div>

<div id="controls">
  <button id="play-btn">▶ 再生</button>
</div>
<div id="voice-controls">
  <label>声の高さ
    <input type="range" id="pitch-range" min="0.5" max="1.3" step="0.02" value="0.72">
  </label>
  <label>速さ
    <input type="range" id="rate-range" min="0.7" max="1.3" step="0.02" value="0.95">
  </label>
</div>

// 3) 台本。1要素 = 1区切り（この単位でスライドが切り替わり、字幕が更新される）
const SCRIPT = [
  { slide: 0, text: "労働協約の番人である。今回は、支部編成と名称の見直しについて説明する。2026年夏季拡大中央執行委員会に向けて整理した資料だ。" },
  { slide: 1, text: "ダイナムユニオンでは、これまで会社のゾーン体制と統括事務所の名称に合わせて支部を編成してきた。現在、沖縄県を除く46都道府県に、25の支部を配置している。" },
  { slide: 2, text: "支部構成そのものについての結論を述べる。組合員数は減少傾向にあるものの、支部や支部三役の数を減らすべき局面ではないと判断した。現行の支部構成は維持する。" },
  { slide: 3, text: "一方で、支部の名称については見直しが必要と判断した。みちのく、宇都宮、金沢など、複数県を擁する支部の一部で、名称と実際の構成県のイメージにズレが生じていたためだ。" },
  { slide: 3, text: "具体的には、みちのく、宇都宮、長野、金沢、佐賀、鹿児島の6支部について、構成県をより正確に表す名称に見直す案とした。目的は、支部の範囲を明確にし、それぞれの支部に愛着を持って活動を推進してもらうことである。以上、支部編成と名称の見直しについての説明を終える。" }
];

/* ==========================================================
   ここから下はロジック本体。通常は書き換え不要。
   ============================================================ */

const slideLayer   = document.getElementById('slide-layer');
const charFullImg  = document.getElementById('char-full-img');
const characterWrap = document.getElementById('character-wrap');
const subtitleText = document.getElementById('subtitle-text');
const playBtn      = document.getElementById('play-btn');

charFullImg.src = CHARACTER_IMAGE;

SLIDES.forEach((src, i) => {
  const img = document.createElement('img');
  img.src = src;
  img.dataset.index = i;
  slideLayer.appendChild(img);
});
const slideImgs = Array.from(slideLayer.querySelectorAll('img'));

function showSlide(i){
  slideImgs.forEach(img => img.classList.toggle('active', Number(img.dataset.index) === i));
}

// --- 発話中インジケーター：口は動かさず、輪郭にごく控えめな光を入れるだけにする ---
// （静止画1枚からの口パクは不自然になりやすいため、あえて動かさない設計にしている）
function startTalking(){
  characterWrap.classList.add('talking');
}
function stopTalking(){
  characterWrap.classList.remove('talking');
}

// --- 日本語ボイスの取得（Chrome等はvoiceschangedが非同期） ---
// 男性キャラの場合に備え、名前に男性を示唆する語を含む声があれば優先的に選ぶ。
// 見つからない場合は最初の日本語音声にフォールバックし、pitch/rateで声色を調整する。
const MALE_HINTS  = /male|man\b|otoya|ichiro|男性|\bd\b/i;
const FEMALE_HINTS = /female|woman|kyoko|女性|\bc\b/i;
let jaVoice = null;
function pickJaVoice(){
  const voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith('ja'));
  if (!voices.length) { jaVoice = null; return; }
  jaVoice =
    voices.find(v => MALE_HINTS.test(v.name)) ||
    voices.find(v => !FEMALE_HINTS.test(v.name)) ||
    voices[0];
}
pickJaVoice();
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = pickJaVoice;
}

// --- 声の高さ・速さ（スライダーで調整可能。数値を変えるだけで声色を微調整できる） ---
const pitchRange = document.getElementById('pitch-range');
const rateRange  = document.getElementById('rate-range');

// --- 台本再生 ---
let playing = false;

function speakLine(i){
  if (!playing) return;
  if (i >= SCRIPT.length){
    playing = false;
    playBtn.disabled = false;
    playBtn.textContent = '▶ 最初から再生';
    return;
  }
  const line = SCRIPT[i];
  showSlide(line.slide);
  subtitleText.textContent = line.text;

  const utter = new SpeechSynthesisUtterance(line.text);
  utter.lang = 'ja-JP';
  if (jaVoice) utter.voice = jaVoice;
  utter.rate  = parseFloat(rateRange.value);   // 読み上げ速度（スライダー連動）
  utter.pitch = parseFloat(pitchRange.value);  // 声の高さ（スライダー連動。デフォルトは低め＝男性的な重厚感を狙う）

  utter.onstart = startTalking;
  utter.onend   = () => { stopTalking(); speakLine(i + 1); };
  utter.onerror = () => { stopTalking(); speakLine(i + 1); };

  speechSynthesis.speak(utter);
}

playBtn.addEventListener('click', () => {
  if (playing){
    // 再生中に押したら停止する
    speechSynthesis.cancel();
    stopTalking();
    playing = false;
    playBtn.textContent = '▶ 再生';
    return;
  }
  speechSynthesis.cancel();
  playing = true;
  playBtn.textContent = '■ 停止';
  speakLine(0);
});

if (SLIDES.length) showSlide(0);
</script>
