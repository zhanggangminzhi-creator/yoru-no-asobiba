<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>よるのあそびば</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Maru+Gothic:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: 'Zen Maru Gothic', sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #232a44 0%, #171c30 55%, #0d1120 100%);
    color: #d7dcec;
    min-height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.2rem;
    padding: 6vh 6vw;
    text-align: center;
  }

  .title {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.7rem;
    letter-spacing: 0.2em;
    color: #efe6cc;
  }

  .sub {
    font-size: 0.82rem;
    color: #9aa2c0;
    line-height: 1.8;
    max-width: 30ch;
    margin-top: -1rem;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
    width: 100%;
    max-width: 340px;
  }

  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 18px;
    padding: 1.4rem 1.5rem;
    text-align: left;
    transition: background 0.25s ease, border-color 0.25s ease;
  }
  .card:active {
    background: rgba(240, 217, 168, 0.1);
    border-color: rgba(240, 217, 168, 0.4);
  }

  .card-name {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.15rem;
    letter-spacing: 0.12em;
    color: #f0e6c8;
    margin-bottom: 0.4rem;
  }

  .card-desc {
    font-size: 0.75rem;
    color: #9aa2c0;
    line-height: 1.7;
  }

  .footer {
    font-size: 0.62rem;
    color: #565c80;
    letter-spacing: 0.08em;
    margin-top: 1rem;
  }
</style>
</head>
<body>

  <div class="title">よるのあそびば</div>
  <div class="sub">好きな方を選んでください。<br>音が出るので、はじめる前に音量にご注意を。</div>

  <div class="cards">
    <a class="card" href="hoshi.html">
      <div class="card-name">ほしにねがいを</div>
      <div class="card-desc">夜空にちらばる星をながめる、静かな星座さがし。</div>
    </a>
    <a class="card" href="nemuri.html">
      <div class="card-name">ねむりのいき</div>
      <div class="card-desc">光の球にあわせて呼吸をととのえる、眠る前のひととき。</div>
    </a>
  </div>

  <div class="footer">タップ・スマホ推奨 / イヤホンがあるとより良い体験に</div>

</body>
</html>
